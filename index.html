<title>Leather Patterns</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,500;0,600;0,700;1,500&family=Karla:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: single-column phone app, hash-routed "screens" toggled via [hidden];
   a tanned-hide palette (warm cream / saddle brown) with a serif display face
   standing in for hand-tooled lettering, paired with a plain grotesque body. */
:root {
  --bg: #f6f0e6;
  --surface: #ffffff;
  --ink: #2a1f16;
  --muted: #897a68;
  --line: #e4d8c7;
  --accent: #935a34;
  --accent-ink: #ffffff;
  --accent-soft: #f0e0cf;
  --danger: #a4402f;
  --danger-soft: #f6e2dd;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #1c1712;
    --surface: #26201a;
    --ink: #f1e9dd;
    --muted: #a69784;
    --line: #3a3128;
    --accent: #d08b53;
    --accent-ink: #231209;
    --accent-soft: #3a2a1b;
    --danger: #e08b78;
    --danger-soft: #3a211d;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #1c1712;
  --surface: #26201a;
  --ink: #f1e9dd;
  --muted: #a6978d;
  --line: #3a3128;
  --accent: #d08b53;
  --accent-ink: #231209;
  --accent-soft: #3a2a1b;
  --danger: #e08b78;
  --danger-soft: #3a211d;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: Karla, -apple-system, system-ui, sans-serif;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex;
  flex-direction: column;
}
h1, h2, h3, .brand, .wordmark { font-family: Fraunces, Georgia, serif; }
.mono { font-family: "JetBrains Mono", ui-monospace, monospace; font-variant-numeric: tabular-nums; }

a { color: var(--accent); }

header.top {
  position: sticky;
  top: env(safe-area-inset-top, 0px);
  background: var(--bg);
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding-block: 16px 12px;
  gap: 10px;
  z-index: 5;
}
.wordmark {
  font-weight: 600;
  font-size: 1.25rem;
  letter-spacing: 0.01em;
  margin: 0;
}
.wordmark em { font-style: italic; color: var(--accent); }

main { flex: 1; padding-bottom: 48px; }

button, .btn {
  font: inherit;
  border: none;
  border-radius: 10px;
  padding: 11px 16px;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  text-decoration: none;
  -webkit-tap-highlight-color: transparent;
}
.btn-accent { background: var(--accent); color: var(--accent-ink); font-weight: 600; }
.btn-ghost { background: transparent; color: var(--ink); border: 1px solid var(--line); }
.btn-danger { background: var(--danger-soft); color: var(--danger); font-weight: 600; }
.btn-text { background: none; color: var(--muted); padding: 8px 4px; }
button:active, .btn:active { transform: scale(0.98); }
button:disabled { opacity: 0.5; cursor: default; }

/* ---- Library screen ---- */
.toolbar {
  display: flex;
  gap: 8px;
  margin-bottom: 16px;
  flex-wrap: wrap;
}
.toolbar input[type=search] {
  flex: 1 1 160px;
}
input[type=text], input[type=search], textarea, select {
  font: inherit;
  width: 100%;
  padding: 10px 12px;
  border-radius: 9px;
  border: 1px solid var(--line);
  background: var(--surface);
  color: var(--ink);
}
select { flex: 0 1 130px; }
textarea { resize: vertical; }

.empty {
  text-align: center;
  color: var(--muted);
  padding: 72px 12px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 14px;
}
.empty svg { opacity: 0.5; }

.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
  gap: 12px;
}
.card {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 14px;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  text-align: left;
  padding: 0;
}
.card .thumb {
  aspect-ratio: 4/3;
  background: var(--accent-soft);
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
}
.card .thumb img { width: 100%; height: 100%; object-fit: contain; }
.card .ext-badge { font-weight: 700; color: var(--accent); letter-spacing: 0.04em; font-size: 0.95rem; }
.card .body { padding: 10px 12px 12px; display: flex; flex-direction: column; gap: 6px; }
.card h3 { margin: 0; font-size: 0.98rem; font-weight: 600; line-height: 1.25; }
.pill {
  display: inline-block;
  font-size: 0.72rem;
  font-weight: 600;
  background: var(--accent-soft);
  color: var(--accent);
  padding: 2px 8px;
  border-radius: 999px;
  width: fit-content;
}
.tags { display: flex; flex-wrap: wrap; gap: 5px; }
.tag { font-size: 0.7rem; color: var(--muted); border: 1px solid var(--line); border-radius: 999px; padding: 1px 7px; }

/* ---- Fab ---- */
.fab {
  position: fixed;
  right: max(18px, calc(env(safe-area-inset-right, 0px) + 18px));
  bottom: max(18px, calc(env(safe-area-inset-bottom, 0px) + 18px));
  width: 56px;
  height: 56px;
  border-radius: 50%;
  background: var(--accent);
  color: var(--accent-ink);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 1.6rem;
  box-shadow: 0 6px 18px rgba(0,0,0,0.25);
  z-index: 10;
}

/* ---- Form screen ---- */
.field { display: flex; flex-direction: column; gap: 6px; margin-bottom: 16px; }
.field label { font-weight: 600; font-size: 0.9rem; }
.field .hint { font-weight: 400; color: var(--muted); font-size: 0.8rem; }
.file-input {
  border: 1.5px dashed var(--line);
  border-radius: 10px;
  padding: 14px;
  background: var(--surface);
}
.file-input input { width: 100%; }
.file-name { font-size: 0.82rem; color: var(--muted); margin-top: 6px; word-break: break-all; }

/* ---- Detail screen ---- */
.detail-head { display: flex; flex-direction: column; gap: 10px; margin-bottom: 18px; }
.detail-thumb {
  background: var(--accent-soft);
  border-radius: 14px;
  min-height: 160px;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
}
.detail-thumb img { width: 100%; max-height: 50vh; object-fit: contain; }
.meta-row { display: flex; gap: 8px; font-size: 0.88rem; }
.meta-row .k { color: var(--muted); min-width: 64px; }
.layer-list { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 4px; }
.layer-list .tag { background: var(--surface); }
.notes-box {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 12px 14px;
  white-space: pre-wrap;
  font-size: 0.92rem;
}
.action-row { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 16px; }
.danger-zone { margin-top: 28px; border-top: 1px solid var(--line); padding-top: 16px; }

/* ---- Modal (standing in for confirm(), which the viewer refuses) ---- */
.modal-backdrop {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.45);
  display: flex;
  align-items: flex-end;
  justify-content: center;
  z-index: 50;
  padding: 16px;
  padding-bottom: max(16px, env(safe-area-inset-bottom, 0px));
}
.modal {
  background: var(--surface);
  border-radius: 16px;
  padding: 20px;
  max-width: 420px;
  width: 100%;
  display: flex;
  flex-direction: column;
  gap: 14px;
}
.modal h3 { margin: 0; }
.modal .row { display: flex; gap: 10px; }
.modal .row button { flex: 1; justify-content: center; }

/* ---- Toast ---- */
#toast {
  position: fixed;
  left: 50%;
  bottom: max(20px, calc(env(safe-area-inset-bottom, 0px) + 20px));
  transform: translateX(-50%) translateY(12px);
  background: var(--ink);
  color: var(--bg);
  padding: 10px 18px;
  border-radius: 999px;
  font-size: 0.88rem;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.2s, transform 0.2s;
  z-index: 60;
  max-width: 90vw;
  text-align: center;
}
#toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

.spinner {
  width: 16px; height: 16px;
  border-radius: 50%;
  border: 2px solid currentColor;
  border-right-color: transparent;
  animation: spin 0.7s linear infinite;
  display: inline-block;
}
@keyframes spin { to { transform: rotate(360deg); } }

.unavailable { padding: 60px 12px; text-align: center; color: var(--muted); }

[hidden] { display: none !important; }
</style>

<header class="top">
  <h1 class="wordmark"><em>Leather</em> Patterns</h1>
  <button class="btn btn-ghost" id="btn-nav-home" hidden>Library</button>
</header>

<main id="app">
  <!-- Screens are rendered into here by the router -->
</main>

<button class="fab" id="fab-add" title="Add pattern" aria-label="Add pattern">+</button>

<div id="toast"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script>
pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";

/* ---------------------------------------------------------------------
 * Capabilities
 * ------------------------------------------------------------------- */
let db = null;
let assets = null;
let downloads = null;
let capabilitiesReady = (async () => {
  try {
    db = await window.claude?.use?.("db") ?? null;
    assets = await window.claude?.use?.("assets") ?? null;
    downloads = await window.claude?.use?.("downloads") ?? null;
  } catch (e) {
    console.error("capability init failed", e);
  }
})();

/* The `downloads` capability only saves files whose extension is on a
 * fixed allowlist -- .lcc and .dxf aren't on it, even though they're
 * plain text underneath. Rather than refuse those files, save them
 * under an allowed extension that still carries the real one visibly
 * (e.g. "Trifold.lcc.json"), and tell the user to rename it back. */
function downloadSafeFilename(filename, ext) {
  const ALLOWED = new Set(["gif","png","jpg","jpeg","webp","mp4","webm","mov","txt","json","md","docx","pptx","epub","csv","ttf","html","svg","pdf","xlsx","zip"]);
  const bare = ext.slice(1).toLowerCase();
  if (ALLOWED.has(bare)) return { filename, renamedTo: null };
  const standIn = ext === ".lcc" ? "json" : "txt";
  return { filename: `${filename}.${standIn}`, renamedTo: ext };
}

async function saveAsset(assetId, filename, ext) {
  if (!downloads) { toast("Saving files isn't available in this view."); return; }
  try {
    const resp = await fetch(assetUrl(assetId));
    if (!resp.ok) throw new Error("fetch " + resp.status);
    const blob = await resp.blob();
    const { filename: safeName, renamedTo } = downloadSafeFilename(filename, ext || "");
    const result = await downloads.save({ filename: safeName, data: blob });
    if (result.status === "saved") {
      toast(renamedTo ? `Saved as ${safeName} — rename it back to "${renamedTo}" to reopen it elsewhere.` : "Saved.");
    }
  } catch (e) {
    if (e?.code === "declined") return;
    console.error(e);
    toast("Could not save that file.");
  }
}

/* ---------------------------------------------------------------------
 * Small helpers
 * ------------------------------------------------------------------- */
const $ = (sel, root = document) => root.querySelector(sel);
const $$ = (sel, root = document) => Array.from(root.querySelectorAll(sel));

function toast(msg) {
  const el = $("#toast");
  el.textContent = msg;
  el.classList.add("show");
  clearTimeout(toast._t);
  toast._t = setTimeout(() => el.classList.remove("show"), 2600);
}

function esc(s) {
  return String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

function cleanTitle(filename) {
  let name = (filename || "").replace(/^.*[\\/]/, "");
  name = name.replace(/\.[^.]+$/, "");
  name = name.replace(/^[0-9a-f]{6,12}-(?=[A-Za-z])/, "");
  name = name.replace(/_/g, " ");
  name = name.replace(/\s*-\s*Copy\s*$/i, "");
  return name.replace(/\s+/g, " ").trim();
}

function extOf(filename) {
  const m = /\.[^.]+$/.exec(filename || "");
  return m ? m[0].toLowerCase() : "";
}

function blobTypeFor(ext) {
  switch (ext) {
    case ".lcc": return "application/json";
    case ".dxf": return "text/plain";
    case ".svg": return "image/svg+xml";
    case ".pdf": return "application/pdf";
    case ".png": return "image/png";
    case ".jpg": case ".jpeg": return "image/jpeg";
    default: return null;
  }
}

const TEXT_EXTS = new Set([".lcc", ".dxf", ".svg"]);
const IMAGE_EXTS = new Set([".png", ".jpg", ".jpeg"]);

/* ---------------------------------------------------------------------
 * .lcc metadata (ported from the Python leathercraft-pdf reader):
 * named layers, a rough shape count (distinct line groups via "gid"),
 * and the overall canvas size from every line's start/end point.
 * ------------------------------------------------------------------- */
function parseLccSummary(text) {
  const clean = text.charCodeAt(0) === 0xfeff ? text.slice(1) : text;
  const data = JSON.parse(clean);

  const layerNames = (data.layers || [])
    .map(l => l.nam)
    .filter(nam => nam && !/^layer\s+\d+$/i.test(nam.trim()));

  const shapes = data.shapes || [];
  const gids = new Set(shapes.map(s => s.gid).filter(g => g !== undefined && g !== null));
  const shapeCount = gids.size || shapes.length;

  let xs = [], ys = [];
  for (const s of shapes) {
    for (const pt of [s.sp, s.ep]) {
      if (Array.isArray(pt) && pt.length === 2) { xs.push(pt[0]); ys.push(pt[1]); }
    }
  }
  const canvasWmm = xs.length ? Math.max(...xs) - Math.min(...xs) : null;
  const canvasHmm = ys.length ? Math.max(...ys) - Math.min(...ys) : null;

  return { layerNames, shapeCount, canvasWmm, canvasHmm };
}

/* ---------------------------------------------------------------------
 * Router
 * ------------------------------------------------------------------- */
function parseHash() {
  const h = location.hash.replace(/^#\/?/, "");
  const parts = h.split("/").filter(Boolean);
  if (parts.length === 0) return { screen: "library" };
  if (parts[0] === "new") return { screen: "new" };
  if (parts[0] === "p" && parts[1]) return { screen: "detail", id: parts[1], edit: parts[2] === "edit" };
  return { screen: "library" };
}

function navigate(hash) { location.hash = hash; }

window.addEventListener("hashchange", render);
window.addEventListener("DOMContentLoaded", () => {
  capabilitiesReady.then(render);
  $("#fab-add").addEventListener("click", () => navigate("#/new"));
  $("#btn-nav-home").addEventListener("click", () => navigate("#/"));
});

/* ---------------------------------------------------------------------
 * Data layer
 * ------------------------------------------------------------------- */
let patternsCache = [];
let patternsUnsub = null;

function subscribePatterns(onChange) {
  if (patternsUnsub) return;
  patternsUnsub = db.collection("patterns").orderBy("createdAt", "desc").onSnapshot(
    snap => {
      patternsCache = snap.docs.map(d => ({ id: d.id, ...d.data() }));
      onChange();
    },
    err => { console.error("patterns subscription error", err); toast("Could not load your library."); }
  );
}

function assetUrl(id) { return id ? ("/_blob/" + id) : null; }

/* ---------------------------------------------------------------------
 * Render: top-level
 * ------------------------------------------------------------------- */
async function render() {
  await capabilitiesReady;
  const app = $("#app");
  const route = parseHash();
  $("#btn-nav-home").hidden = route.screen === "library";
  $("#fab-add").hidden = route.screen !== "library";

  if (!db || !assets) {
    app.innerHTML = `<div class="unavailable">
      <p>This page needs to be opened as your Claude artifact (signed in) to store patterns.</p>
      <p>Open it from your Claude app or claude.ai, not as a plain shared file.</p>
    </div>`;
    return;
  }

  if (route.screen === "library") { subscribePatterns(renderLibrary); renderLibrary(); return; }
  if (route.screen === "new") { renderForm(null); return; }
  if (route.screen === "detail") { renderDetail(route.id, route.edit); return; }
}

/* ---------------------------------------------------------------------
 * Library screen
 * ------------------------------------------------------------------- */
let libraryFilter = { q: "", category: "", tag: "" };

function renderLibrary() {
  if (parseHash().screen !== "library") return;
  const app = $("#app");

  const categories = [...new Set(patternsCache.map(p => p.category).filter(Boolean))].sort();
  const allTags = [...new Set(patternsCache.flatMap(p => p.tags || []))].sort();

  const q = libraryFilter.q.trim().toLowerCase();
  const filtered = patternsCache.filter(p => {
    if (q && !((p.name || "").toLowerCase().includes(q) || (p.notes || "").toLowerCase().includes(q))) return false;
    if (libraryFilter.category && p.category !== libraryFilter.category) return false;
    if (libraryFilter.tag && !(p.tags || []).includes(libraryFilter.tag)) return false;
    return true;
  });

  app.innerHTML = `
    <div class="toolbar">
      <input type="search" id="f-q" placeholder="Search name or notes…" value="${esc(libraryFilter.q)}">
      <select id="f-cat">
        <option value="">All categories</option>
        ${categories.map(c => `<option value="${esc(c)}" ${c === libraryFilter.category ? "selected" : ""}>${esc(c)}</option>`).join("")}
      </select>
      <select id="f-tag">
        <option value="">All tags</option>
        ${allTags.map(t => `<option value="${esc(t)}" ${t === libraryFilter.tag ? "selected" : ""}>${esc(t)}</option>`).join("")}
      </select>
    </div>
    ${filtered.length === 0 ? renderEmpty() : `<div class="grid">${filtered.map(cardHtml).join("")}</div>`}
  `;

  $("#f-q").addEventListener("input", e => { libraryFilter.q = e.target.value; renderLibrary(); });
  $("#f-cat").addEventListener("change", e => { libraryFilter.category = e.target.value; renderLibrary(); });
  $("#f-tag").addEventListener("change", e => { libraryFilter.tag = e.target.value; renderLibrary(); });
  $$(".card").forEach(c => c.addEventListener("click", () => navigate("#/p/" + c.dataset.id)));
}

function renderEmpty() {
  const hasAny = patternsCache.length > 0;
  return `<div class="empty">
    <svg width="56" height="56" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M4 4h11l5 5v11a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V5a1 1 0 0 1 1-1z"/><path d="M15 4v5h5"/></svg>
    <p>${hasAny ? "No patterns match that filter." : "No patterns yet. Tap + to add your first one."}</p>
  </div>`;
}

function cardHtml(p) {
  const thumb = p.thumbnailAssetId
    ? `<img src="${assetUrl(p.thumbnailAssetId)}" alt="">`
    : `<span class="ext-badge">${esc((p.originalExt || "").replace(".", "").toUpperCase())}</span>`;
  const meta = [];
  if (p.shapeCount) meta.push(`${p.shapeCount} piece${p.shapeCount === 1 ? "" : "s"}`);
  if (p.canvasWmm && p.canvasHmm) meta.push(`${Math.round(p.canvasWmm)}×${Math.round(p.canvasHmm)}mm`);
  return `
    <div class="card" data-id="${esc(p.id)}" role="button" tabindex="0">
      <div class="thumb">${thumb}</div>
      <div class="body">
        <h3>${esc(p.name)}</h3>
        ${p.category ? `<span class="pill">${esc(p.category)}</span>` : ""}
        ${meta.length ? `<div class="mono" style="font-size:.76rem;color:var(--muted)">${meta.join(" · ")}</div>` : ""}
        ${(p.tags || []).length ? `<div class="tags">${p.tags.map(t => `<span class="tag">${esc(t)}</span>`).join("")}</div>` : ""}
      </div>
    </div>`;
}

/* ---------------------------------------------------------------------
 * Upload / edit form screen
 * ------------------------------------------------------------------- */
function renderForm(existing) {
  const app = $("#app");
  const isEdit = !!existing;
  app.innerHTML = `
    <h2>${isEdit ? "Edit pattern" : "Add a pattern"}</h2>
    <form id="pattern-form">
      ${isEdit ? "" : `
      <div class="field">
        <label>Pattern file <span class="hint">.lcc, .dxf, .svg, .pdf, or a photo</span></label>
        <div class="file-input"><input type="file" id="f-file" required></div>
        <div class="file-name" id="f-file-name"></div>
      </div>
      <div class="field" id="pdf-field" hidden>
        <label>Reference PDF <span class="hint">optional — a print-ready cut sheet, if separate</span></label>
        <div class="file-input"><input type="file" id="f-pdf" accept=".pdf"></div>
      </div>`}
      <div class="field">
        <label>Name</label>
        <input type="text" id="f-name" placeholder="e.g. Classic Trifold Wallet" value="${esc(existing?.name || "")}">
        ${isEdit ? "" : `<span class="hint">leave blank to use the filename</span>`}
      </div>
      <div class="field">
        <label>Category <span class="hint">e.g. Wallet, Bag, Case</span></label>
        <input type="text" id="f-category" value="${esc(existing?.category || "")}">
      </div>
      <div class="field">
        <label>Tags <span class="hint">comma-separated</span></label>
        <input type="text" id="f-tags" value="${esc((existing?.tags || []).join(', '))}" placeholder="bifold, veg-tan, gift">
      </div>
      <div class="field">
        <label>Notes</label>
        <textarea id="f-notes" rows="4" placeholder="Leather weight, stitch length, anything worth remembering…">${esc(existing?.notes || "")}</textarea>
      </div>
      <div class="action-row">
        <button type="submit" class="btn-accent" id="f-submit">${isEdit ? "Save changes" : "Save pattern"}</button>
        <button type="button" class="btn-ghost" id="f-cancel">Cancel</button>
      </div>
    </form>
  `;

  $("#f-cancel").addEventListener("click", () => history.back());

  if (!isEdit) {
    $("#f-file").addEventListener("change", e => {
      const f = e.target.files[0];
      $("#f-file-name").textContent = f ? f.name : "";
      const ext = extOf(f?.name);
      $("#pdf-field").hidden = ext === ".pdf" || IMAGE_EXTS.has(ext);
      if (!$("#f-name").value) $("#f-name").value = cleanTitle(f?.name || "");
    });
  }

  $("#pattern-form").addEventListener("submit", async e => {
    e.preventDefault();
    const btn = $("#f-submit");
    btn.disabled = true;
    const originalLabel = btn.innerHTML;
    btn.innerHTML = `<span class="spinner"></span> Saving…`;
    try {
      if (isEdit) await submitEdit(existing);
      else await submitNew();
    } catch (err) {
      console.error(err);
      toast(err.message || "Something went wrong saving that.");
      btn.disabled = false;
      btn.innerHTML = originalLabel;
    }
  });
}

async function submitEdit(existing) {
  const name = $("#f-name").value.trim() || "Untitled pattern";
  const category = $("#f-category").value.trim();
  const tags = tagsFromInput($("#f-tags").value);
  const notes = $("#f-notes").value.trim();
  await db.collection("patterns").doc(existing.id).update({
    name, category, tags, notes, updatedAt: new Date().toISOString(),
  });
  toast("Saved.");
  navigate("#/p/" + existing.id);
}

function tagsFromInput(raw) {
  const seen = new Set();
  const out = [];
  for (const t of raw.split(",").map(s => s.trim()).filter(Boolean)) {
    const k = t.toLowerCase();
    if (!seen.has(k)) { seen.add(k); out.push(t); }
  }
  return out;
}

async function submitNew() {
  const fileInput = $("#f-file");
  const file = fileInput.files[0];
  if (!file) throw new Error("Choose a pattern file first.");
  const ext = extOf(file.name);
  const contentType = blobTypeFor(ext);
  if (!contentType) throw new Error(`Unsupported file type "${ext}". Try .lcc, .dxf, .svg, .pdf, or a photo.`);

  let layerNames = [], shapeCount = null, canvasWmm = null, canvasHmm = null;
  if (ext === ".lcc") {
    try {
      const text = await file.text();
      const summary = parseLccSummary(text);
      layerNames = summary.layerNames; shapeCount = summary.shapeCount;
      canvasWmm = summary.canvasWmm; canvasHmm = summary.canvasHmm;
    } catch (e) {
      console.warn("could not parse .lcc metadata", e);
    }
  }

  const originalUp = await assets.upload(file, { type: contentType });

  let pdfAssetId = null;
  const pdfFile = $("#f-pdf")?.files?.[0];
  if (ext === ".pdf") {
    pdfAssetId = originalUp.id;
  } else if (pdfFile) {
    const pdfUp = await assets.upload(pdfFile, { type: "application/pdf" });
    pdfAssetId = pdfUp.id;
  }

  let thumbnailAssetId = null;
  if (IMAGE_EXTS.has(ext)) {
    thumbnailAssetId = originalUp.id;
  } else if (pdfAssetId) {
    const srcBlob = ext === ".pdf" ? file : pdfFile;
    const thumbBlob = await renderPdfThumbnail(srcBlob).catch(e => { console.warn("thumbnail failed", e); return null; });
    if (thumbBlob) {
      const thumbUp = await assets.upload(thumbBlob, { type: "image/png" });
      thumbnailAssetId = thumbUp.id;
    }
  }

  const name = $("#f-name").value.trim() || cleanTitle(file.name);
  const now = new Date().toISOString();
  const doc = await db.collection("patterns").add({
    name,
    category: $("#f-category").value.trim(),
    tags: tagsFromInput($("#f-tags").value),
    notes: $("#f-notes").value.trim(),
    originalFilename: file.name,
    originalExt: ext,
    originalAssetId: originalUp.id,
    pdfAssetId, thumbnailAssetId,
    layerNames, shapeCount, canvasWmm, canvasHmm,
    createdAt: now, updatedAt: now,
  });
  toast("Pattern saved.");
  navigate("#/p/" + doc.id);
}

async function renderPdfThumbnail(blob) {
  const buf = await blob.arrayBuffer();
  const pdf = await pdfjsLib.getDocument({ data: buf }).promise;
  const page = await pdf.getPage(1);
  const viewport = page.getViewport({ scale: 1.0 });
  const scale = 480 / viewport.width;
  const scaledViewport = page.getViewport({ scale });
  const canvas = document.createElement("canvas");
  canvas.width = scaledViewport.width;
  canvas.height = scaledViewport.height;
  await page.render({ canvasContext: canvas.getContext("2d"), viewport: scaledViewport }).promise;
  return new Promise(resolve => canvas.toBlob(resolve, "image/png"));
}

/* ---------------------------------------------------------------------
 * Detail screen
 * ------------------------------------------------------------------- */
async function renderDetail(id, editing) {
  const app = $("#app");
  app.innerHTML = `<div class="unavailable"><span class="spinner"></span></div>`;
  let p = patternsCache.find(x => x.id === id);
  if (!p) {
    const snap = await db.collection("patterns").doc(id).get();
    if (!snap.exists) { app.innerHTML = `<div class="unavailable">That pattern isn't here anymore.</div>`; return; }
    p = { id: snap.id, ...snap.data() };
  }
  if (editing) { renderForm(p); return; }

  const thumb = p.thumbnailAssetId
    ? `<img src="${assetUrl(p.thumbnailAssetId)}" alt="">`
    : `<div class="ext-badge" style="font-size:2rem;padding:50px 0">${esc((p.originalExt || "").replace(".", "").toUpperCase())}</div>`;

  app.innerHTML = `
    <div class="detail-head">
      <div class="detail-thumb">${thumb}</div>
      <h2 style="margin:0">${esc(p.name)}</h2>
      ${p.category ? `<span class="pill">${esc(p.category)}</span>` : ""}
    </div>

    <div class="meta-row"><span class="k">File</span><span>${esc(p.originalFilename)}</span></div>
    ${p.shapeCount ? `<div class="meta-row"><span class="k">Shapes</span><span>~${p.shapeCount}</span></div>` : ""}
    ${p.canvasWmm && p.canvasHmm ? `<div class="meta-row"><span class="k">Canvas</span><span class="mono">${Math.round(p.canvasWmm)} × ${Math.round(p.canvasHmm)} mm</span></div>` : ""}
    <div class="meta-row"><span class="k">Added</span><span>${esc((p.createdAt || "").slice(0, 10))}</span></div>

    ${(p.layerNames || []).length ? `
      <div style="margin-top:10px">
        <div class="k" style="font-size:.88rem">Named layers</div>
        <div class="layer-list">${p.layerNames.map(l => `<span class="tag">${esc(l)}</span>`).join("")}</div>
      </div>` : ""}

    ${(p.tags || []).length ? `<div class="tags" style="margin-top:12px">${p.tags.map(t => `<span class="tag">${esc(t)}</span>`).join("")}</div>` : ""}

    ${p.notes ? `<div class="notes-box" style="margin-top:14px">${esc(p.notes)}</div>` : ""}

    <div class="action-row">
      <button class="btn btn-ghost" id="btn-save-original">Save original (${esc(p.originalExt)})</button>
      ${p.pdfAssetId ? `<button class="btn btn-ghost" id="btn-save-pdf">Save PDF</button>` : ""}
      <button class="btn btn-ghost" id="btn-edit">Edit details</button>
    </div>

    <div class="danger-zone">
      <button class="btn btn-danger" id="btn-delete">Delete this pattern</button>
    </div>
  `;

  $("#btn-edit").addEventListener("click", () => navigate(`#/p/${p.id}/edit`));
  $("#btn-delete").addEventListener("click", () => confirmDelete(p));
  $("#btn-save-original").addEventListener("click", () => saveAsset(p.originalAssetId, p.originalFilename, p.originalExt));
  if (p.pdfAssetId) {
    $("#btn-save-pdf").addEventListener("click", () => saveAsset(p.pdfAssetId, `${p.name}.pdf`, ".pdf"));
  }
}

function confirmDelete(p) {
  const wrap = document.createElement("div");
  wrap.className = "modal-backdrop";
  wrap.innerHTML = `
    <div class="modal">
      <h3>Delete “${esc(p.name)}”?</h3>
      <p style="margin:0;color:var(--muted);font-size:.9rem">This removes it and its files for good. There's no undo.</p>
      <div class="row">
        <button class="btn-ghost" id="m-cancel">Cancel</button>
        <button class="btn-danger" id="m-confirm">Delete</button>
      </div>
    </div>`;
  document.body.appendChild(wrap);
  wrap.addEventListener("click", e => { if (e.target === wrap) wrap.remove(); });
  $("#m-cancel", wrap).addEventListener("click", () => wrap.remove());
  $("#m-confirm", wrap).addEventListener("click", async () => {
    wrap.querySelector(".row").innerHTML = `<span class="spinner"></span>`;
    try {
      for (const assetId of new Set([p.originalAssetId, p.pdfAssetId, p.thumbnailAssetId].filter(Boolean))) {
        await assets.delete(assetId).catch(e => console.warn("asset delete failed", assetId, e));
      }
      await db.collection("patterns").doc(p.id).delete();
      wrap.remove();
      toast("Deleted.");
      navigate("#/");
    } catch (e) {
      console.error(e);
      toast("Could not delete that pattern.");
      wrap.remove();
    }
  });
}
</script>
