{% extends "base.html" %}
{% block title %}Add a pattern — Leather Patterns{% endblock %}
{% block content %}

<h1>Add a pattern</h1>

<form class="pattern-form" method="post" action="/patterns" enctype="multipart/form-data">
  <label>
    Pattern file <span class="hint">(.lcc, .dxf, .svg, .pdf, or a photo)</span>
    <input type="file" name="pattern_file" required>
  </label>

  <label>
    Reference PDF <span class="hint">(optional — a print-ready cut sheet, if you have one separate from the pattern file)</span>
    <input type="file" name="reference_pdf" accept=".pdf">
  </label>

  <label>
    Name <span class="hint">(leave blank to use the filename)</span>
    <input type="text" name="name" placeholder="e.g. Classic Trifold Wallet">
  </label>

  <label>
    Category <span class="hint">(e.g. Wallet, Bag, Case)</span>
    <input type="text" name="category" list="category-options" placeholder="Wallet">
    <datalist id="category-options">
      {% for c in categories %}<option value="{{ c }}">{% endfor %}
    </datalist>
  </label>

  <label>
    Tags <span class="hint">(comma-separated)</span>
    <input type="text" name="tags" list="tag-options" placeholder="bifold, veg-tan, gift">
    <datalist id="tag-options">
      {% for t in tags %}<option value="{{ t }}">{% endfor %}
    </datalist>
  </label>

  <label>
    Notes
    <textarea name="notes" rows="4" placeholder="Leather weight, stitch length, anything worth remembering next time…"></textarea>
  </label>

  <div class="form-actions">
    <button type="submit">Save pattern</button>
    <a href="/">Cancel</a>
  </div>
</form>

{% endblock %}
